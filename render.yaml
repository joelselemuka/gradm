# =============================================================================
# Render Blueprint -- Application GSM (plan GRATUIT)
# =============================================================================
# Deploiement : connecter ce repo sur render.com -> "New Blueprint"
# Render creera : 1 Web Service + 1 PostgreSQL
# NOTE : Redis non disponible en gratuit -> taches Celery synchrones en demo
# =============================================================================

services:

  # Application Web Django (ASGI / Daphne)
  - type: web
    name: gsm-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: daphne -b 0.0.0.0 -p 10000 config.asgi:application
    plan: free
    region: frankfurt
    healthCheckPath: /users/login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: gsm-db
          property: connectionString
      # Email SMTP (optionnel - a ajouter manuellement dans le dashboard Render)
      # - key: EMAIL_HOST
      #   value: smtp.gmail.com
      # - key: EMAIL_PORT
      #   value: "587"
      # - key: EMAIL_HOST_USER
      #   value: it.kolwezi@gmail.com
      # - key: EMAIL_HOST_PASSWORD
      #   sync: false
      # - key: DEFAULT_FROM_EMAIL
      #   value: gradmsupermarket@gmail.com
      # - key: ADMIN_REPORT_EMAIL
      #   value: joelselemuka100@gmail.com

# PostgreSQL (plan free = 90 jours)
databases:
  - name: gsm-db
    plan: free
    region: frankfurt
    databaseName: supermarket
    user: supermarket
