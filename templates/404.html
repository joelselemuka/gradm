{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page introuvable · GSM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; background: #f7f8fa; }
    .error-card { text-align: center; padding: 60px 48px; background: #fff; border: 1px solid #e4e7eb; border-radius: 16px; max-width: 480px; width: 90%; box-shadow: 0 4px 24px rgba(31,35,43,.07); }
    .error-code { font-size: 80px; font-weight: 800; letter-spacing: -.05em; color: #1f232b; line-height: 1; margin: 0 0 8px; }
    .error-card h1 { margin: 0 0 10px; font-size: 22px; font-weight: 700; color: #20242d; }
    .error-card p { margin: 0 0 28px; color: #777f8c; font-size: 14px; line-height: 1.6; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 700; background: #1f232b; color: #fff; border: 1px solid #1f232b; }
    .btn:hover { background: #323945; }
    .btn-sec { background: #fff; color: #3d4653; border: 1px solid #dce1e7; border-radius: 8px; padding: 11px 20px; font-size: 13px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; margin-left: 8px; }
    .btn-sec:hover { background: #f5f6f8; }
  </style>
</head>
<body>
  <div class="error-card">
    <p class="error-code">404</p>
    <h1>Page introuvable</h1>
    <p>La page que vous cherchez n'existe pas ou a ete deplacee.<br>Verifiez l'URL ou retournez au tableau de bord.</p>
    <div>
      <a class="btn" href="/">Tableau de bord</a>
      <a class="btn-sec" href="javascript:history.back()">Retour</a>
    </div>
  </div>
</body>
</html>
