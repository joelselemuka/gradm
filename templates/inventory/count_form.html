{% extends 'base.html' %}
{% block heading %}Nouvel inventaire{% endblock %}
{% block content %}<section class="form-card"><p class="eyebrow">Stock</p><h2>Démarrer un inventaire physique</h2><form method="post">{% csrf_token %}{% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<small class="form-error">{{ error }}</small>{% endfor %}</label>{% endfor %}<div class="form-actions"><button class="button button-primary" type="submit">Démarrer</button><a class="button button-secondary" href="{% url 'inventory:count-list' %}">Annuler</a></div></form></section>{% endblock %}
