{% load static %}
<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Étiquettes prix</title><link rel="stylesheet" href="{% static 'css/admin-workflows.css' %}"></head><body class="price-preview-body"><div class="price-print-toolbar"><button type="button" onclick="window.print()">Imprimer les étiquettes</button><button type="button" onclick="window.close()">Fermer</button></div><main class="price-label-sheet">{% for variant in variants %}<article class="price-label"><h2>{{ variant.product.name }}</h2><strong>{{ variant.sale_price|money }}</strong></article>{% empty %}<p>Aucun article actif.</p>{% endfor %}</main></body></html>
