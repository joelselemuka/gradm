# ============================================================
# Configuration Nginx — Application GSM
# ============================================================
#
# Prérequis :
#   - Remplacer "votre-domaine.com" par le vrai domaine
#   - Certificat TLS via : certbot certonly --nginx -d votre-domaine.com
#   - Volume staticfiles monté sur /app/staticfiles
#   - Volume media monté sur /app/media
# ============================================================

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name votre-domaine.com;

    # Permet à Certbot de valider le domaine via HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur HTTPS principal
server {
    listen 443 ssl http2;
    server_name votre-domaine.com;

    # ----- Certificats TLS (Let's Encrypt) -----
    ssl_certificate     /etc/letsencrypt/live/votre-domaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ----- Headers de sécurité -----
    add_header X-Frame-Options             SAMEORIGIN                    always;
    add_header X-Content-Type-Options      nosniff                       always;
    add_header Referrer-Policy             strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains; preload" always;

    # ----- Taille maximale des requêtes -----
    client_max_body_size 10M;

    # ----- Compression gzip -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss text/javascript;

    # ----- Fichiers statiques (Django collectstatic) -----
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----- Fichiers media (uploads) -----
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ----- Restriction accès Django Admin (réseau interne uniquement) -----
    # Décommenter et adapter les IPs autorisées en production.
    # location /admin/ {
    #     allow 192.168.1.0/24;
    #     deny all;
    #     proxy_pass http://web:8000;
    #     include /etc/nginx/proxy_params;
    # }

    # ----- WebSockets (Django Channels) -----
    location /ws/ {
        proxy_pass         http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ----- Application Django (HTTP) -----
    location / {
        proxy_pass             http://web:8000;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_connect_timeout  30s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
    }
}
