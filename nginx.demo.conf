# ============================================================
# Configuration Nginx — MODE DÉMO / TEST (sans domaine, sans TLS)
# ============================================================
#
# Usage : démo client ou test interne sur réseau local.
# Accès via : http://<IP-du-serveur>  ou  http://localhost
#
# Pour passer en production avec TLS, utilisez nginx.conf
# (le fichier principal avec Let's Encrypt).
# ============================================================

server {
    listen 80;
    server_name _;  # Accepte toute requête quelle que soit l'adresse

    # ----- Taille maximale des requêtes -----
    client_max_body_size 10M;

    # ----- Compression gzip -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript text/javascript;

    # ----- Fichiers statiques (Django collectstatic) -----
    location /static/ {
        alias /app/staticfiles/;
        expires 1h;
        access_log off;
    }

    # ----- Fichiers media (uploads) -----
    location /media/ {
        alias /app/media/;
    }

    # ----- WebSockets (Django Channels) -----
    location /ws/ {
        proxy_pass         http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ----- Application Django -----
    location / {
        proxy_pass             http://web:8000;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_connect_timeout  30s;
        proxy_read_timeout     60s;
    }
}
