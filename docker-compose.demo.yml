services:

  # ------------------------------------------------------------------ #
  # Service d'initialisation : migrations + collectstatic.              #
  # ------------------------------------------------------------------ #
  migrate:
    build: .
    image: gsm-app:latest
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py scan_expiration_alerts &&
             python manage.py collectstatic --noinput"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------ #
  # Application principale ASGI (Daphne).                              #
  # ------------------------------------------------------------------ #
  web:
    image: gsm-app:latest
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    env_file: .env
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Reverse proxy Nginx — MODE DÉMO (HTTP, sans TLS, sans domaine).    #
  # Accès : http://<ip-du-serveur>  ou  http://localhost               #
  # ------------------------------------------------------------------ #
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Base de données PostgreSQL.                                         #
  # ------------------------------------------------------------------ #
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supermarket}
      POSTGRES_USER: ${POSTGRES_USER:-supermarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supermarket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supermarket}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Redis — broker Celery + Channel Layers WebSocket.                  #
  # ------------------------------------------------------------------ #
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-change-me-redis-password}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Worker Celery (tâches asynchrones).                                 #
  # ------------------------------------------------------------------ #
  celery_worker:
    image: gsm-app:latest
    command: celery -A config worker -l INFO --concurrency 2
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Celery Beat (tâches planifiées).                                    #
  # ------------------------------------------------------------------ #
  celery_beat:
    image: gsm-app:latest
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media:
  staticfiles:
